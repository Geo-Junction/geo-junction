{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete – Geo‑Junction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background: #ebf5fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 16px 48px rgba(26, 82, 118, 0.12);
            border-top: 4px solid #f1c40f;
            text-align: center;
        }
        .auth-card .auth-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }
        .auth-card h3 {
            font-weight: 700;
            color: #1e293b;
        }
        .auth-card .subtitle {
            color: #64748b;
            font-size: 1.05rem;
        }
        .auth-card .btn-primary {
            background: #1a5276;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .auth-card .btn-primary:hover {
            background: #0e2f47;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 82, 118, 0.2);
        }
        @media (max-width: 576px) {
            .auth-card {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card">
                    <i class="fas fa-check-circle auth-icon"></i>
                    <h3>Password Reset Complete</h3>
                    <p class="subtitle">Your password has been successfully reset. You can now log in with your new password.</p>
                    <a href="{% url 'geo:login' %}" class="btn btn-primary mt-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Log In
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
